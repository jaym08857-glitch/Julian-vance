<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="Editorial architectural portrait illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="60%" stop-color="#1D1E24" />
      <stop offset="100%" stop-color="#0E0E12" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="900" fill="url(#bgGrad)" />
  <rect width="800" height="900" fill="url(#archGrid)" />

  <!-- Architectural Composition Rings & Framing -->
  <circle cx="400" cy="410" r="260" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <circle cx="400" cy="410" r="210" fill="none" stroke="rgba(37,99,235,0.45)" stroke-width="1.5" stroke-dasharray="8 6" />
  <line x1="80" y1="410" x2="720" y2="410" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <line x1="400" y1="80" x2="400" y2="740" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Abstract Sculptural Portrait Silhouette -->
  <path d="M230 760 C230 610, 300 545, 400 545 C500 545, 570 610, 570 760 Z" fill="#23252E" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
  <path d="M285 760 C295 645, 340 590, 400 590 C460 590, 505 645, 515 760" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- Head & Architectural Planes -->
  <rect x="315" y="250" width="170" height="225" rx="85" fill="#2A2D38" stroke="#F4F4F0" stroke-width="2" />
  <!-- Minimalist Glasses / Visor Line -->
  <rect x="335" y="335" width="56" height="36" rx="6" fill="none" stroke="#60A5FA" stroke-width="2.5" />
  <rect x="409" y="335" width="56" height="36" rx="6" fill="none" stroke="#60A5FA" stroke-width="2.5" />
  <line x1="391" y1="352" x2="409" y2="352" stroke="#60A5FA" stroke-width="2.5" />

  <!-- Structural Accent Geometry -->
  <circle cx="565" cy="245" r="14" fill="#2563EB" />
  <rect x="140" y="130" width="170" height="58" rx="6" fill="rgba(20,20,26,0.9)" stroke="rgba(255,255,255,0.16)" />
  <text x="160" y="156" fill="#9CA3AF" font-family="monospace" font-size="11" letter-spacing="1">SYSTEMS ARCHITECTURE</text>
  <text x="160" y="175" fill="#F4F4F0" font-family="sans-serif" font-size="13" font-weight="600">99.98% Uptime · 12M+ Req/s</text>

  <rect x="480" y="640" width="210" height="64" rx="6" fill="rgba(20,20,26,0.92)" stroke="rgba(37,99,235,0.5)" />
  <text x="500" y="666" fill="#60A5FA" font-family="monospace" font-size="11" letter-spacing="1">DESIGN ENGINEERING</text>
  <text x="500" y="687" fill="#F4F4F0" font-family="sans-serif" font-size="13" font-weight="600">WCAG AAA · Zero-Runtime CSS</text>

  <!-- Bottom Editorial Caption Bar -->
  <line x1="60" y1="815" x2="740" y2="815" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="60" y="848" fill="#F4F4F0" font-family="sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">JULIAN VANCE — PRINCIPAL ARCHITECT</text>
  <text x="545" y="848" fill="#9CA3AF" font-family="monospace" font-size="13">SAN FRANCISCO · EST. 2018</text>
</svg>
